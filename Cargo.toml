[package]
name = "swoncord"
version = "0.1.0"
edition = "2024"

[dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSString",
    "NSDictionary",
    "NSArray",
    "NSEnumerator",
    "NSObject",
    "NSValue",
    "NSNotification",
    "NSDistributedNotificationCenter",
    "NSOperation",
    "NSGeometry",
    "NSDate",
    "NSTimer",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSResponder",
    "NSApplication",
    "NSRunningApplication",
    "NSWorkspace",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSMenu",
    "NSMenuItem",
    "NSCell",
    "NSImage",
    "NSControl",
    "NSView",
    "NSButton",
] }
objc2-service-management = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2",
    "objc2-foundation",
    "SMAppService",
] }
block2 = "0.6.2"
crossbeam = "0.8.4"
discord-rich-presence = "1.1.0"
log = "0.4.32"
pretty_env_logger = "0.5.0"
thiserror = "2.0.18"
musicbrainz_rs = { version = "0.13.0", default-features = false, features = ["sync", "rustls"] }
reqwest = { version = "0.13.4", features = ["blocking"] }
regex = "1.12.3"
serde = "1.0.228"
osakit = { version = "0.3.1", features = ["full"]}

[dev-dependencies]
serde_json = "1.0.150"

[profile.release]
opt-level = 3        # maximum runtime optimization
lto = "fat"          # whole-program link-time optimization across all crates
codegen-units = 1    # one unit = best optimization (slower compile)
panic = "abort"      # smaller/faster; no unwinding tables
strip = true         # drop debug symbols from the final binary

[package.metadata.bundle]
name = "Swoncord"
identifier = "com.oblique.media.swoncord"
icon = ["assets/icon.icns"]
osx_info_plist_exts = ["Resources/Info.plist"]
category = "public.app-category.utilities"
short_description = "Rich presence for Swinsian"
long_description = """
Simple menu bar app that shows the currently playing song in Discord for Swinsian.
"""
